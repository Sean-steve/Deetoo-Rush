      operationId: finance_post_adjustments_id_approve
      security:
      - bearerAuth: []
  /finance/adjustments/{id}/reject:
    post:
      summary: Reject a requested financial adjustment
      tags: [Finance]
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      responses:
        '200':
          description: Rejected adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: finance_post_adjustments_id_reject
      security:
      - bearerAuth: []
  /finance/disbursements:
    get:
      summary: List durable money-out attempts
      tags: [Finance]
      responses:
        '200':
          description: Disbursement attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: finance_get_disbursements
      security:
      - bearerAuth: []
  /finance/disbursements/destinations:
    get:
      summary: List verified payout destinations
      tags: [Finance]
      responses:
        '200':
          description: Payout destinations with secrets omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: finance_get_disbursement_destinations
      security:
      - bearerAuth: []
    post:
      summary: Create or replace a verified payout destination
      tags: [Finance]
      responses:
        '201':
          description: Payout destination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: finance_post_disbursement_destinations
      security:
      - bearerAuth: []
  /finance/disbursements/callback:
    post:
      summary: Trusted payout gateway callback
      tags: [Finance]
      responses:
        '200':
          description: Provider result accepted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: finance_post_disbursement_callback
      security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session access token issued by POST /auth/login or /auth/register/customer.
    webhookSecret:
      type: apiKey
      in: header
      name: x-webhook-secret
      description: Shared secret injected by the trusted ingress gateway after it independently validates
        the call genuinely originated from the provider (M-PESA Daraja). This is gateway authentication,
        not a provider-issued signature -- Safaricom does not sign these requests itself. Stripe webhooks
        instead use Stripe-Signature HMAC verification against the raw body and are not covered by this
        scheme.
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated principal is not permitted to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiErrorDetail:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. ORDER_NOT_FOUND
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDetail'
    PaginationMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        total_count:
          type: integer
    ApiResponseGeneric:
      type: object
      required:
      - data
      description: Generic success envelope. data is intentionally untyped here where a route has not
        yet had its specific response schema individually verified (see the STUB markers in the paths
        above).
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        requestId:
          type: string
        success:
          type: boolean
    MoneyMinor:
      type: integer
      description: 'Money convention used throughout this API: every amount is an integer count of the
        currency''s minor unit (e.g. 125000 = KES 1,250.00), always paired with a sibling `currency` field
        (ISO 4217, e.g. "KES"). There is no floating-point money anywhere in this API. Fields follow the
        `<name>_minor` naming pattern (e.g. subtotal_minor, total_minor, amount_minor).'
    Address:
      type: object
      required:
      - id
      - customer_id
      - label
      - address_line1
      - city
      - region
      - country_code
      - address_text
      - latitude
      - longitude
      - is_default
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: string
        customer_id:
          type: string
        label:
          type: string
          example: Home
        recipient_name:
          type: string
        phone_e164:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        landmark:
          type: string
        city:
          type: string
        region:
          type: string
        country_code:
          type: string
        postal_code:
          type: string
        address_text:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        delivery_instructions:
          type: string
        is_default:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuItem:
      type: object
      required:
      - id
      - menu_id
      - category_id
      - name
      - price_minor
      - currency
      - is_available
      - sort_order
      properties:
        id:
          type: string
        menu_id:
          type: string
        category_id:
          type: string
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          type: string
          example: KES
        image_url:
          type: string
        is_available:
          type: boolean
        sort_order:
          type: integer
        modifier_group_ids:
          type: array
          items:
            type: string
    MenuCategory:
      type: object
      required:
      - id
      - menu_id
      - name
      - sort_order
      - is_active
      properties:
        id:
          type: string
        menu_id:
          type: string
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    Branch:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is_open:
          type: boolean
    Order:
      type: object
      required:
      - id
      - public_code
      - order_number
      - customer_id
      - branch_id
      - merchant_id
      - status
      - currency
      - subtotal_minor
      - delivery_fee_minor
      - service_fee_minor
      - discount_minor
      - total_minor
      - items
      properties:
        id:
          type: string
        public_code:
          type: string
        order_number:
          type: string
        checkout_quote_id:
          type: string
        customer_id:
          type: string
        branch_id:
          type: string
        merchant_id:
          type: string
        status:
          type: string
          description: See DEE-STATE-001 for the full order state machine.
        currency:
          type: string
        subtotal_minor:
          $ref: '#/components/schemas/MoneyMinor'
        delivery_fee_minor:
          $ref: '#/components/schemas/MoneyMinor'
        service_fee_minor:
          $ref: '#/components/schemas/MoneyMinor'
        discount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        total_minor:
          $ref: '#/components/schemas/MoneyMinor'
        items:
          type: array
          items:
            type: object
        special_instructions:
          type: string
          nullable: true
        placed_at:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        checkout_url:
          type: string
          nullable: true
          description: Stripe-hosted card checkout URL; available after provider initiation.
        id:
          type: string
        order_id:
          type: string
        customer_id:
          type: string
        method:
          type: string
          enum:
          - MPESA
          - CARD
        status:
          type: string
          description: See DEE-FIN-001 for the payment state machine.
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          type: string
        provider_reference:
          type: string
          nullable: true
        mpesa_receipt_number:
          type: string
          nullable: true
    CartResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          type: object
          description: Cart
          properties:
            items:
              type: array
              items:
                type: object
            subtotal_minor:
              $ref: '#/components/schemas/MoneyMinor'
            branch_id:
              type: string
    BranchResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          $ref: '#/components/schemas/Branch'
    BranchListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    MenuResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'
    QuoteResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          type: object
          description: 'CheckoutQuote: bound delivery fee, expiry, and totals valid to create an order
            from.'
    OrderResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          $ref: '#/components/schemas/Order'
    PaymentResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          $ref: '#/components/schemas/Payment'
    AuthSessionResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponseGeneric'
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            user:
              type: object
    CustomerRegisterRequest:
      type: object
      required:
      - name
      - password
      description: Either email or phone_e164 is required (validated server-side, not enforceable in plain
        JSON Schema).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone_e164:
          type: string
        password:
          type: string
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          description: Email or phone number
        password:
          type: string
        device_info:
          type: string
          maxLength: 255
        device_id:
          type: string
          maxLength: 100
    AddToCartRequest:
      type: object
      required:
      - branch_id
      - menu_item_id
      - quantity
      properties:
        branch_id:
          type: string
        menu_item_id:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        modifier_option_ids:
          type: array
          items:
            type: string
          default: []
        force_clear_existing:
          type: boolean
          default: false
          description: Deetoo carts hold items from one branch at a time; set true to explicitly replace
            an existing cart from a different branch.
    UpdateCartItemRequest:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 99
          description: 0 removes the line item.
    ApplyPromoCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
    GenerateQuoteRequest:
      type: object
      required:
      - address_id
      properties:
        payment_method:
          type: string
          enum: [MPESA, CARD]
          description: Binds payment method; MPESA rounds total up to whole KES, freezing the adjustment in platform service fees.
        address_id:
          type: string
        notes:
          type: string
          maxLength: 500
    CreateOrderRequest:
      type: object
      description: One of quote_id / quoteId is required (accepts either casing).
      properties:
        quote_id:
          type: string
        quoteId:
          type: string
        special_instructions:
          type: string
          maxLength: 500
    CancelOrderRequest:
      type: object
      description: One of reason_code / reasonCode is required (accepts either casing).
      properties:
        reason_code:
          type: string
        reasonCode:
          type: string
        note:
          type: string
          maxLength: 255
    PaymentInitiateRequest:
      type: object
      required:
      - method
      description: phone is required and must be >= 9 characters when method is MPESA.
      properties:
        method:
          type: string
          enum:
          - MPESA
          - CARD
        phone:
          type: string
        payment_method_token:
          type: string
          description: Optional Stripe-collected token. Omit for hosted card checkout.
