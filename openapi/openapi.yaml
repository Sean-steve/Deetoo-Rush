# Deetoo API - OpenAPI 3.1 contract
# Generated once from live router source; hand-maintain from here. See info.description.
# Coverage enforced in CI by scripts/openapi-coverage-check.ts (pnpm openapi:coverage).
openapi: 3.1.0
info:
  title: Deetoo API
  version: 1.0.0
  description: 'Deetoo multi-vendor food delivery platform API (Kenya/East Africa).


    **Coverage note (honest, not aspirational):** this file was generated from the actual Express router
    source (scripts/openapi-coverage-check.ts enforces this in CI going forward -- it fails the build
    if a route exists in code but not here, or vice versa), so every path, method, tag, and auth requirement
    below is real. Of the 261 operations, 31 core commerce-flow operations (public discovery, auth, cart,
    checkout, order, payment) have hand-verified request/response schemas transcribed from the actual
    Zod validators and domain types. The remaining operations are marked `STUB` in their summary: they
    are registered with the correct path/method/tag/security so drift is still caught, but their request/response
    bodies are intentionally left as a generic envelope rather than guessed. Replacing each STUB with
    its real schema is tracked as ongoing work, not represented here as already done.'
  contact:
    name: Deetoo Engineering
servers:
- url: http://localhost:3000/api/v1
  description: Local development
tags:
- name: Public Discovery
  description: 'Unauthenticated browse: branches, menus, service zones.'
- name: Auth
  description: Registration, login, sessions, MFA.
- name: Customer
  description: Customer profile and saved addresses.
- name: Cart
  description: Customer shopping cart.
- name: Checkout
  description: Quote generation prior to order creation.
- name: Order
  description: Order lifecycle.
- name: Payment
  description: Payment initiation, provider webhooks, refunds.
- name: Merchant
  description: Merchant account and branch management.
- name: Merchant Catalogue
  description: Menu, category, item, and modifier management.
- name: Merchant Orders
  description: 'Merchant-side order queue: accept, prepare, ready, reject.'
- name: Rider
  description: 'Rider delivery lifecycle: offers, pickup, dropoff, proof, earnings.'
- name: Finance
  description: Settlements, payouts, reconciliation, adjustments. Most routes require ADMIN or FINANCE
    role.
- name: Admin
  description: Platform administration. Most routes require ADMIN, OPS, or SUPPORT role.
- name: Operations (Admin/Ops)
  description: Dispatch recovery, kill switches, incident tooling.
- name: Support
  description: Customer support tooling.
- name: Realtime
  description: Server-sent event streams for live order/delivery updates.
- name: Health
  description: Liveness and readiness probes. Unauthenticated.
security:
- bearerAuth: []
paths:
  /devices/register:
    post:
      summary: Register or refresh an authenticated application push device
      tags: [Rider]
      operationId: devices_register
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, push_token]
              properties:
                recipient_type: { type: string, enum: [CUSTOMER, MERCHANT, RIDER, ADMIN] }
                platform: { type: string, enum: [ANDROID, IOS, WEB] }
                push_token: { type: string, minLength: 20 }
                device_id: { type: string }
                app_version: { type: string }
      responses:
        '201': { description: Device registration accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/unregister:
    post:
      summary: Disable a push device belonging to the authenticated user
      tags: [Rider]
      operationId: devices_unregister
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              properties:
                push_token: { type: string }
      responses:
        '200': { description: Device disabled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /media/uploads:
    post:
      summary: Create a scoped private-media upload intent
      tags: [Rider]
      operationId: media_create_upload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, content_type]
              properties:
                purpose:
                  type: string
                  enum: [DELIVERY_PROOF, DELIVERY_INCIDENT, RIDER_DOCUMENT, MERCHANT_IMAGE, SUPPORT_ATTACHMENT]
                content_type: { type: string }
                reference_type: { type: string }
                reference_id: { type: string, format: uuid }
      responses:
        '201': { description: Signed private upload intent created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Resource state does not permit this upload }
        '503': { description: Private storage is not configured }
  /media/uploads/{id}/complete:
    post:
      summary: Verify a private-media upload against object storage
      tags: [Rider]
      operationId: media_complete_upload
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Media verified }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{id}/read-url:
    get:
      summary: Issue a short-lived authorized URL for private media
      tags: [Rider]
      operationId: media_read_url
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Short-lived signed read URL }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rider/earnings:
    get:
      summary: Return the authenticated Rider's earning ledger view
      tags: [Rider]
      operationId: rider_get_earnings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Rider earnings and eligible balance }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /rider/payouts:
    get:
