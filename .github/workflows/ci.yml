name: Deetoo CI Pipeline

on:
  push:
    branches: [main, master, develop, 'phase-*']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, Test & Independent Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile



      - name: Verify pnpm-only repository policy
        run: |
          test -f pnpm-lock.yaml
          test ! -e package-lock.json
          test ! -e bun.lock
          test ! -e yarn.lock

      - name: Run Linters
        run: pnpm lint

      - name: Run Type Checks
        run: pnpm typecheck

      - name: Validate OpenAPI contract
        run: pnpm openapi:validate

      - name: Check OpenAPI contract matches router source
        run: pnpm openapi:coverage

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Audit production dependencies
        # Temporary, explicit build-tool exceptions. Both advisories currently have
        # no patched release and are reached only through apps/rider-android > expo > @expo/cli.
        # Remove each --ignore immediately when a fixed Expo/CLI dependency chain is available.
        run: >-
          pnpm audit --prod --audit-level high
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-vfj7-8cjw-p6xm

      - name: Typecheck Rider Android
        run: pnpm typecheck:rider-android

      - name: Run Phase 2 fulfilment regressions
        run: pnpm test:phase2

      - name: Run Phase 3 operations and money-out regressions
        run: pnpm test:phase3

      - name: Validate Rider Android native prebuild
        run: pnpm prebuild:rider-android

      - name: Build Rider Android bundle
        run: pnpm build:rider-android

      - name: Build Customer Web independently
        run: pnpm build:customer

      - name: Build design-first Customer Web preview independently
        run: pnpm build:customer-next

      - name: Build Merchant Web independently
        run: pnpm build:merchant

      - name: Build Admin Web independently
        run: pnpm build:admin

      - name: Build design-first Admin frontend independently
        run: pnpm build:admin-next

      - name: Build API independently
        run: pnpm build:api

  durable-foundation:
    name: PostgreSQL migrations, authorization and outbox recovery
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation_test_only
          POSTGRES_DB: deetoo_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deetoo_foundation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://postgres:foundation_test_only@127.0.0.1:5432/deetoo_foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:foundation
      - name: Verify paid-order capture and checkout inventory holds
        run: pnpm test:paid-order

  code-analysis:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  browser-acceptance:
    name: Independent web browser acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify independent web auth and role isolation
        run: pnpm test:phase1-browser

      - name: Verify approved Admin Phase 1 frontend-only workflows and capture reference screens
        run: pnpm test:admin-next-visual

      - name: Verify design-first customer preview and capture reference viewport
        run: pnpm test:customer-next-visual

      - name: Verify Phase B2 API-connected customer shopping with mocked backend contracts
        run: pnpm test:customer-next-connected

      - name: Upload approved Admin frontend-only Phase 1 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-next-phase1-visual
          path: visual-output/admin-next/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload design-first customer screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-next-visual-preview
          path: visual-output/customer-next/
          if-no-files-found: warn
          retention-days: 10


      - name: Upload approved Merchant live-screen visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-live-eight-screen-captures
          path: test-results/**/merchant-live-*.png
          if-no-files-found: warn
          retention-days: 14


  customer-shopping-real-services:
    name: Real PostGIS Redis API shopping journey (local payment only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_acceptance_only
          POSTGRES_DB: deetoo_foundation_shopping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deetoo_foundation_shopping"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      APP_ENV: test
      DEETOO_STORAGE_MODE: postgres
      DEETOO_FIXTURES: 'false'
      # Synthetic payment is exclusively allowed for isolated local/test DBs;
      # this job is NOT a Safaricom staging certification.
      DEETOO_LOCAL_WORKFLOW: 'true'
      DATABASE_URL: postgres://postgres:isolated_acceptance_only@127.0.0.1:5432/deetoo_foundation_shopping
      REDIS_URL: redis://127.0.0.1:6379/13
      JWT_SECRET: CI_only_random_environment_not_for_deploy_deetoo_2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Exercise real API, PostgreSQL/PostGIS, Redis, checkout and payment worker
        run: pnpm test:customer-next-real-services


  customer-delivery-real-services:
    name: Real PostGIS Redis Merchant-Rider-Delivery journey (local payment only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_delivery_only
          POSTGRES_DB: deetoo_foundation_delivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deetoo_foundation_delivery"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      APP_ENV: test
      DEETOO_STORAGE_MODE: postgres
      DEETOO_FIXTURES: 'false'
      # Explicit synthetic local-only payments: never a Safaricom staging claim.
      DEETOO_LOCAL_WORKFLOW: 'true'
      DATABASE_URL: postgres://postgres:isolated_delivery_only@127.0.0.1:5432/deetoo_foundation_delivery
      REDIS_URL: redis://127.0.0.1:6379/14
      JWT_SECRET: CI_only_random_environment_not_for_deploy_deetoo_2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Validate real database payment, merchant fulfilment, rider dispatch, pickup OTP and delivered completion
        run: pnpm test:local-workflow
