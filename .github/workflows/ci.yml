name: Deetoo CI Pipeline

on:
  push:
    branches: [main, master, develop, 'phase-*']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, Test & Independent Builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bootstrap pnpm lockfile on Phase 1 branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'phase-1-platform-split-security' }}
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already tracked"
            exit 0
          fi
          test -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add pnpm lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run Linters
        run: pnpm lint

      - name: Run Type Checks
        run: pnpm typecheck

      - name: Validate OpenAPI contract
        run: pnpm openapi:validate

      - name: Check OpenAPI contract matches router source
        run: pnpm openapi:coverage

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build Customer Web independently
        run: pnpm build:customer

      - name: Build Merchant Web independently
        run: pnpm build:merchant

      - name: Build Admin Web independently
        run: pnpm build:admin

      - name: Build API independently
        run: pnpm build:api

  durable-foundation:
    name: PostgreSQL migrations, authorization and outbox recovery
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: foundation_test_only
          POSTGRES_DB: deetoo_foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deetoo_foundation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://postgres:foundation_test_only@127.0.0.1:5432/deetoo_foundation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test:foundation

  code-analysis:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  browser-acceptance:
    name: Independent web browser acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify independent web auth and role isolation
        run: pnpm test:phase1-browser
