version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: deetoo-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: deetoo_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deetoo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deetoo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in local S3-compatible private media. Existing postgres/redis are untouched
  # when starting just this service via: docker compose --profile media up -d minio
  minio:
    profiles: ["media"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: deetoo-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      # Only reachable on the laptop loopback interface. Override in .env.
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-deetoo_local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-deetoo_local_change_this_password}
      # Community MinIO supports global (not per-bucket) browser CORS.
      # Only local application origins are allowed; the bucket remains private.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5178,http://127.0.0.1:5178"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
